# Potential types from MountPotentialInfo. Type 12 does not exist.
# oddsRare1/2/3 - weight of picking THIS potential type when the foal's coat has
# star rarity tier 1/2/3 (DNA_SkinInfo.Rare). Read by HorseRegistry into
# PotentialInfo::oddsByCoatTier; consumed by Genetics::CalculateFoalPotential.
# *** SHAPE is stock (MountPotentialInfo.OddsRare1..3). NUMBERS ARE OUR DESIGN:
#     Ntreev shipped all 42 cells as 0.000000, so they cannot be restored.
#     Three quality bands, uniform inside a band. This is balance, edit freely.
# These keys are MANDATORY: a missing key must fail config load loudly rather
# than silently fall back to a uniform coin flip.
potentials:
